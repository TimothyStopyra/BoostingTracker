<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boosting Tracker · Jomboy Media</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <div class="brand-mark">
      <span class="field-num">JMB</span>
      <div>
        <h1>Boosting Tracker</h1>
        <div class="sub">2026 season · paid social boost log</div>
      </div>
    </div>
    <nav class="view-nav">
      <button class="active" data-view="2026">2026 Boosts</button>
      <button disabled title="Coming soon">By Brand</button>
      <button disabled title="Coming soon">By Podcast</button>
    </nav>
  </header>

  <section class="data-panel">
    <div class="data-status">
      <span class="dot"></span>
      <span id="dataStatusText">Using default embedded dataset</span>
    </div>
    <div class="data-actions">
      <span class="year-input">
        Year <input type="number" id="dataYear" value="2026" min="2000" max="2100" />
      </span>
      <label class="upload-btn" for="csvUpload">Upload CSV</label>
      <input type="file" id="csvUpload" accept=".csv" style="display:none" />
      <button class="clear-data-btn" id="clearDataBtn">Reset to default</button>
    </div>
    <div class="upload-error" id="uploadError" style="display:none;"></div>
  </section>

  <section class="kpi-strip" id="kpiStrip"></section>

  <section class="filter-panel">
    <div class="filter-grid">
      <div class="filter-field">
        <label for="startFrom">Start date from</label>
        <input type="date" id="startFrom" />
      </div>
      <div class="filter-field">
        <label for="startTo">Start date to</label>
        <input type="date" id="startTo" />
      </div>
      <div class="filter-field">
        <label for="endFrom">End date from</label>
        <input type="date" id="endFrom" />
      </div>
      <div class="filter-field">
        <label for="endTo">End date to</label>
        <input type="date" id="endTo" />
      </div>
      <div class="filter-field">
        <label>Budget</label>
        <div class="range-inputs">
          <input type="number" id="budgetMin" placeholder="Min" min="0" step="1" />
          <span class="dash">–</span>
          <input type="number" id="budgetMax" placeholder="Max" min="0" step="1" />
        </div>
      </div>
      <div class="filter-field">
        <label>Spend</label>
        <div class="range-inputs">
          <input type="number" id="spendMin" placeholder="Min" min="0" step="1" />
          <span class="dash">–</span>
          <input type="number" id="spendMax" placeholder="Max" min="0" step="1" />
        </div>
      </div>
      <div class="filter-field">
        <label for="monthSelect">Month <span class="hint">(⌘/Ctrl-click for multiple)</span></label>
        <select id="monthSelect" multiple size="4">
          <option value="1">Jan</option>
          <option value="2">Feb</option>
          <option value="3">Mar</option>
          <option value="4">Apr</option>
          <option value="5">May</option>
          <option value="6">Jun</option>
          <option value="7">Jul</option>
          <option value="8">Aug</option>
          <option value="9">Sep</option>
          <option value="10">Oct</option>
          <option value="11">Nov</option>
          <option value="12">Dec</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="brandSelect">Brand <span class="hint">(⌘/Ctrl-click for multiple)</span></label>
        <select id="brandSelect" multiple size="4"></select>
      </div>
      <div class="filter-field">
        <label>Platform</label>
        <div class="chip-group">
          <div class="chip" data-platform="FB">FB</div>
          <div class="chip" data-platform="IG">IG</div>
          <div class="chip" data-platform="TW">TW</div>
          <div class="chip" data-platform="TT">TT</div>
        </div>
      </div>
    </div>

    <div class="flags-grid" style="margin-top:18px; padding-top:16px; border-top:1px solid var(--border-soft);">
      <div class="flag-toggle">
        <label>Fanatics?</label>
        <div class="tri-toggle" data-flag="fanatics">
          <button data-val="any" class="active">Any</button>
          <button data-val="yes">Yes</button>
          <button data-val="no">No</button>
        </div>
      </div>
      <div class="flag-toggle">
        <label>Segment?</label>
        <div class="tri-toggle" data-flag="segment">
          <button data-val="any" class="active">Any</button>
          <button data-val="yes">Yes</button>
          <button data-val="no">No</button>
        </div>
      </div>
      <div class="flag-toggle">
        <label>Curation/Integration?</label>
        <div class="tri-toggle" data-flag="curationIntegration">
          <button data-val="any" class="active">Any</button>
          <button data-val="yes">Yes</button>
          <button data-val="no">No</button>
        </div>
      </div>
      <div class="flag-toggle">
        <label>WHG?</label>
        <div class="tri-toggle" data-flag="whg">
          <button data-val="any" class="active">Any</button>
          <button data-val="yes">Yes</button>
          <button data-val="no">No</button>
        </div>
      </div>
      <div class="flag-toggle">
        <label>Standard?</label>
        <div class="tri-toggle" data-flag="standard">
          <button data-val="any" class="active">Any</button>
          <button data-val="yes">Yes</button>
          <button data-val="no">No</button>
        </div>
      </div>
    </div>

    <div class="filter-bottom-row">
      <span class="result-count" id="resultCount"></span>
      <button class="reset-btn" id="resetBtn">Reset filters</button>
    </div>
  </section>

  <section class="table-panel">
    <div class="table-scroll">
      <table class="boosts">
        <thead>
          <tr>
            <th data-key="id">ID</th>
            <th data-key="platform">Platform</th>
            <th data-key="brand">Brand / Content</th>
            <th data-key="start">Dates</th>
            <th class="num-col" data-key="totalBudget">Budget</th>
            <th class="num-col" data-key="totalSpent">Spent</th>
            <th class="num-col" data-key="deliveredViews">Views</th>
            <th class="num-col" data-key="cpm">CPM</th>
            <th>Tags</th>
          </tr>
        </thead>
        <tbody id="boostsBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">No boosts match these filters</div>
    </div>
  </section>

  <div class="footer-note">Boosting Tracker · Jomboy Media · Data sourced from the 2026 tab</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
